[project]
name = "chart-mcp-server"
version = "0.1.0"
description = "MCP server that renders line and candlestick stock charts with Matplotlib"
readme = "README.md"
requires-python = ">=3.11"
# Kept in sync with the root requirements.txt — this server is normally
# launched from the project virtualenv, not installed on its own.
dependencies = [
    "fastmcp>=3.2,<4",
    "matplotlib>=3.10,<4",
    "numpy>=2.4,<3",
]
